<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola Mundo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <section class="tarjeta" aria-labelledby="titulo-principal">
      <h1 id="titulo-principal" class="titulo">Hola Mundo</h1>
      <p class="bienvenida">
        Bienvenido a esta página de ejemplo. Es una demostración sencilla,
        creada con HTML, CSS y JavaScript, pensada para verse bien en
        cualquier dispositivo.
      </p>

      <button id="boton-saludar" class="boton" type="button">Saludar</button>

      <p id="mensaje" class="mensaje" role="status" aria-live="polite">
        Aún no me has saludado.
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
